# systemd starts the supervisor with the default PATH (/usr/local/bin:/usr/bin),
# which has no ~/.local/bin. Pitchfork finds `mise` on its own when wrapping a
# daemon's `run` (it searches well-known install paths), but it does not wrap
# `ready_cmd` or hook commands: those inherit this environment, so a probe
# calling `mise` exits 127 while the daemon itself starts fine.
#
# A drop-in rather than a line in the unit: `pitchfork boot enable`, re-run by
# the post-dotfiles hook on every apply, rewrites
# ~/.config/systemd/user/pitchfork.service and truncates the file.
[Service]
Environment=PATH=%h/.local/bin:/usr/local/bin:/usr/bin:/bin
