# Clipboard. The host clipboard is reached directly over Wayland (wl-clipboard,
# socket reverse-forwarded into the instance), so tmux and Neovim use the real
# host clipboard instead of the internal buffer / OSC 52 chain. Copies in tmux
# copy-mode still go to the tmux buffer; set-clipboard additionally forwards
# them to the terminal for clients whose TERM advertises OSC 52.
set -g set-clipboard on
# Answer app clipboard queries (OSC 52, e.g. a paste) from tmux's newest buffer.
# "request"/"both" would ask the outer terminal, which mosh does not forward.
set -g get-clipboard buffer
set -ag terminal-features 'foot:clipboard'
# mosh (>= 1.4.0) only accepts OSC 52 with an explicit "c;" selection and
# silently ignores the empty-selection form ("52;;") tmux emits for copy-mode.
# mosh also presents TERM=xterm-256color, so force the clipboard selection
# there; the ssh/foot path (TERM=foot) keeps the default.
# The dead "%?%{0}%t%p1%s%;" branch only exists so the format references %p1:
# modern tmux expands Ms with tiparm_s(), which rejects a format that omits
# %p1 (tmux/tmux "could not expand Ms", issue #4081). It emits nothing.
set -ag terminal-overrides ',xterm-256color:Ms=\E]52;c;%p2%s\a%?%{0}%t%p1%s%;'

# Shell and general behaviour.
set -g default-shell /usr/bin/zsh
set -g mouse on
set -g status-keys vi
set -g mode-keys vi
set -wg mode-keys vi
set -g focus-events on
set -g visual-activity off
set -g automatic-rename off

# SIXEL image display for the foot -> ssh -> tmux chain.
# allow-passthrough (tmux >= 3.3) forwards image escape sequences verbatim
# to foot, which renders sixel at full quality (image.nvim backend and
# `chafa --passthrough` rely on this).
set -g allow-passthrough on
# Fallback: tell tmux foot supports sixel, so raw sixel emitted in a pane
# (img2sixel, chafa without passthrough) is handled by tmux and forwarded.
set -ag terminal-features 'foot:sixel'

# Neovim-like copy mode: prefix + [ then v to start a selection, move the
# cursor (hjkl/w/b), y or Enter to copy, q to cancel. copy-selection-and-cancel
# hands the selection to foot over OSC 52 (set-clipboard above).
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Rename the first window of a new session to a petname.
set-hook -g after-new-session "run-shell 'sleep 0.1 && bash ~/.config/tmux/scripts/init-window.sh'"

# Catppuccin theme. The plugin is generated on demand by the pre-dotfiles hook
# (see sklein-devbox-mise-config/README.md); flavor macchiato, aligned with foot,
# Starship and Atuin. Update from the repo root with:
#   mise -C sklein-devbox-mise-config run update-catppuccin-tmux
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_window_status_style "none"
set -g status-position top
source-file ~/.config/tmux/plugins/catppuccin/tmux/catppuccin_options_tmux.conf
source-file ~/.config/tmux/plugins/catppuccin/tmux/catppuccin_tmux.conf

# Status bar: hide the window list; show host, current window name and the
# truncated current path. Pane titles (set from .zshrc) feed choose-window.
set -g window-status-format ""
set -g window-status-current-format ""
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#[fg=#{@thm_mauve}]🧰 #[fg=#{@thm_teal}]#{host_short} #[fg=#{@thm_overlay_2}]󰓩 #[fg=#{@thm_fg}]#{window_name} #[fg=#{@thm_mauve}]❯ #[fg=#{@thm_green}]#(bash ~/.config/tmux/scripts/current-path.sh #{pane_current_path})"
set -g status-right ""

# Refresh the status bar when the active pane changes.
set-hook -g after-select-pane "refresh-client -S"

# Window and pane management.
bind-key % split-window -h -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key w display-popup -E -w 95% -h 95% \
  "bash ~/.config/tmux/scripts/choose-window.sh"
bind-key Up    select-pane -U
bind-key Down  select-pane -D
bind-key Left  select-pane -L
bind-key Right select-pane -R
bind-key c run-shell "bash ~/.config/tmux/scripts/new-window.sh"
bind-key r display-popup -E -w 50 -h 5 \
  "bash ~/.config/tmux/scripts/rename-window.sh"
# Floating pane (tmux >= 3.7): open a shell in the current directory.
unbind-key t
bind-key t new-pane -c "#{pane_current_path}" -x 90% -y 85%
