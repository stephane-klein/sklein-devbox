name: Build and push incus-builder image

on:
  workflow_dispatch:

concurrency:
  group: incus-builder-image-push
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    container:
      image: node:24-bookworm
    steps:
      - name: Docker client
        run: |
          apt-get update
          apt-get install -y --no-install-recommends docker.io
      - uses: https://code.forgejo.org/actions/checkout@v4
        env:
          GIT_SSL_NO_VERIFY: 'true'
      - name: Auth registry
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          AUTH="$(printf '%s:%s' "$REGISTRY_USER" "$REGISTRY_TOKEN" | base64 -w0)"
          mkdir -p "$HOME/.docker"
          printf '{"auths":{"forgejo.sklein.internal":{"auth":"%s"}}}' "$AUTH" > "$HOME/.docker/config.json"
      - name: Build and push
        env:
          IMAGE: forgejo.sklein.internal/stephane-klein/incus-builder-image
        run: |
          set -euo pipefail
          docker build --file containers/incus-builder-image/Containerfile --tag "$IMAGE:latest" .
          docker push "$IMAGE:latest"
