# `pitchfork boot enable` writes Restart=on-failure, and a supervisor killed by
# another process (an on-demand client auto-start, or a manual `pitchfork
# supervisor start --force`) exits cleanly: systemd records Result=success and
# leaves the unit inactive. From then on a supervisor runs beside the unit
# without `--boot`: the proxy answers, the boot_start daemons (openchamber, the
# OpenCode publisher, the ingress DNS) stay down, and every ingress URL returns
# 502 "No daemon found for host" until `sklein-devbox-ingress up` hands the
# supervisor back to systemd.
#
# Restart=always brings the unit back in RestartSec (10 s) after such a kill,
# in boot mode, so the mistake repairs itself. An operator stop still wins:
# `systemctl --user stop pitchfork` is final. Leave the supervisor down with
# that command, not with `pitchfork supervisor stop`, which systemd now undoes.
#
# A drop-in rather than a line in the unit: `pitchfork boot enable`, re-run by
# the post-dotfiles hook on every apply, rewrites
# ~/.config/systemd/user/pitchfork.service and truncates the file.
[Service]
Restart=always
