[settings]
lockfile = true
system_packages.sudo = true
dotfiles.root = "./dotfiles/"
# The repository is the source of truth for these dotfiles; disable mise's
# own git-backed history (removes the "History" / "Setup repository" hints
# from `mise dot status`).
history.enabled = false

[bootstrap.secrets]
SSH_ID_RSA_2016_PRIVATE = "SSH_ID_RSA_2016_PRIVATE"
MISE_CI_READONLY_GITHUB_TOKEN = "MISE_CI_READONLY_GITHUB_TOKEN"
OPENCHAMBER_UI_PASSWORD = "OPENCHAMBER_UI_PASSWORD"
# Password of the pitchfork-supervised `opencode serve` (OpenCode 2).
OPENCODE_SERVER_PASSWORD = "OPENCODE_SERVER_PASSWORD"
INCUS_PRIVATE_CLIENT_CRT = "INCUS_PRIVATE_CLIENT_CRT"
INCUS_PRIVATE_CLIENT_KEY = "INCUS_PRIVATE_CLIENT_KEY"
HOMELAB_STEPHANE_KLEIN_INFO_K3S_KUBECONFIG = "HOMELAB_STEPHANE_KLEIN_INFO_K3S_KUBECONFIG"
GITHUB_CLI_TOKEN = "GITHUB_CLI_TOKEN"

# OpenCode MCP
CONTEXT7_APIKEY = "CONTEXT7_APIKEY"
TAVILY_APIKEY = "TAVILY_APIKEY"
EXA_IA_OPENCODE_DEVBOX_APIKEY = "EXA_IA_OPENCODE_DEVBOX_APIKEY"
HINDSIGHT_MCP_TOKEN = "HINDSIGHT_MCP_TOKEN"
BROWSER_CONTROL_MCP_EXTENSION_SECRET = "BROWSER_CONTROL_MCP_EXTENSION_SECRET"
MEMEX_SKLEIN_XYZ_MCP_READER_OPENCODE_TOKEN = "MEMEX_SKLEIN_XYZ_MCP_READER_OPENCODE_TOKEN"

# OpenCode provider
OPENCODE_GO_APIKEY = "OPENCODE_GO_APIKEY"
OPENROUTER_SKLEIN_DEVBOX_APIKEY = "OPENROUTER_SKLEIN_DEVBOX_APIKEY"
DEEPSEEK_COM_OPENCODE_SKLEIN_DEVBOX_APIKEY = "DEEPSEEK_COM_OPENCODE_SKLEIN_DEVBOX_APIKEY"
OPENCODE_GO_ACCOUNT2_APIKEY = "OPENCODE_GO_ACCOUNT2_APIKEY"

[bootstrap.packages]
"dnf:zsh" = "latest"
"dnf:tree" = "latest"

# mosh-server, required by `sklein-devbox console --terminal=mosh` (the mosh
# client runs on the workstation; this is the server side inside the instance).
"dnf:mosh" = "latest"

# Build toolchain required to compile Neovim TreeSitter parsers (and native plugins).
"dnf:gcc" = "latest"
"dnf:gcc-c++" = "latest"
"dnf:make" = "latest"
"dnf:cmake" = "latest"

# GPG commit/tag signing (git, jj) needs a pinentry to prompt for the key
# passphrase; the secret keys are imported into ~/.config/gnupg by
# import-gpg-keys.sh. `~/.local/libexec/sklein-devbox/pinentry-tmux` shows the
# prompt in a tmux popup; without an attached tmux client, signing fails at
# once with "No pinentry" instead of blocking (jj git init included).
"dnf:pinentry" = "latest"
"dnf:pinentry-tty" = "latest"

# Remote-desktop link: notify-send and paplay/pactl reach the foot host's
# desktop over the session dbus and pulse sockets reverse-forwarded into the
# instance by the CLI's `console` (sklein-devbox-foot-link-<instance>.service).
"dnf:libnotify" = "latest"
"dnf:pulseaudio-utils" = "latest"

# dnsmasq used by dotfiles/bin/sklein-devbox-ingress
"dnf:dnsmasq" = "latest"
"dnf:bind-utils" = "latest"

[bootstrap.user]
login_shell = "/bin/zsh"

[bootstrap.hooks.post-packages]
# The image ships with Etc/UTC. Set the timezone system-wide so journald,
# timers, `date` and every process agree; `timedatectl` is idempotent (it is a
# no-op when /etc/localtime already points at the right zone). Runs on
# `mise bootstrap`, not on `mise dot apply`.
run = "sudo timedatectl set-timezone Europe/Paris"

[bootstrap.hooks.pre-user]
run = "sudo chsh -s /bin/zsh devbox"

[bootstrap.hooks.pre-dotfiles]
# The catppuccin/tmux and fzf-tab plugins are not committed (see ../.gitignore);
# fetch them the first time the dotfiles are applied, before they are copied to
# ~/.config/tmux and ~/.config/zsh. The directories are empty only on a fresh
# machine, so this is a no-op afterwards.
run = '''
if [ -z "$(ls -A "{{ config_root }}/dotfiles/dot-config/tmux/plugins/catppuccin/tmux" 2>/dev/null)" ]; then
  bash "{{ config_root }}/scripts/sync-catppuccin-tmux.sh"
fi
if [ -z "$(ls -A "{{ config_root }}/dotfiles/dot-config/zsh/fzf-tab" 2>/dev/null)" ]; then
  bash "{{ config_root }}/scripts/sync-fzf-tab.sh"
fi
'''

[bootstrap.hooks.post-dotfiles]
run = '''
if [ ! -f "$HOME/.kube/config.d/00-current.kubeconfig" ]; then
  mkdir -p "$HOME/.kube/config.d"
  cat > "$HOME/.kube/config.d/00-current.kubeconfig" <<'EOF'
apiVersion: v1
kind: Config
current-context: homelab
EOF
fi
mise install

# OpenCode 2: pitchfork supervises `opencode serve --service`, which registers
# itself as the shared service so every client discovers its URL and password
# without flags. Pin port/hostname/password here. `service set` stops a running
# service, so only write when the value differs.
if command -v opencode >/dev/null 2>&1; then
  [ "$(opencode service get port 2>/dev/null)" = "4096" ] ||
    opencode service set port 4096 >/dev/null 2>&1 || true
  [ "$(opencode service get hostname 2>/dev/null)" = "127.0.0.1" ] ||
    opencode service set hostname 127.0.0.1 >/dev/null 2>&1 || true
  if [ -n "${OPENCODE_SERVER_PASSWORD-}" ] &&
    [ "$(opencode service get password 2>/dev/null)" != "$OPENCODE_SERVER_PASSWORD" ]; then
    opencode service set password "$OPENCODE_SERVER_PASSWORD" >/dev/null 2>&1 || true
  fi
fi

if [ -x "$HOME/bin/import-opencode-credentials" ]; then
  "$HOME/bin/import-opencode-credentials" || true
fi

# Keep the shared background service enabled. Do not set `disabled true` to stop
# clients from starting a server on port 4096: that flag does not block a
# server, it makes every client behave like `--standalone`, so each one runs a
# private server on an ephemeral port and stops using the supervised one (same
# `opencode.db`, several servers, OpenChamber still on 4096). Keep the key at
# `false`; `set disabled false` does not stop a running service (only `true`
# does).
if command -v opencode >/dev/null 2>&1; then
  [ "$(opencode service get disabled 2>/dev/null)" = "false" ] ||
    opencode service set disabled false >/dev/null 2>&1 || true
fi

# Register the supervisor with systemd (user unit). The unit runs
# `supervisor run --boot`, the only mode where daemons marked `boot_start` start
# with the supervisor; without it, a supervisor reload leaves the OpenCode
# server down and nothing brings it back. Re-running `enable` keeps the recorded
# executable path current and rewrites the unit file, so reload systemd right
# after it: without a reload systemd keeps the old definition and later reports
# "the unit file changed on disk".
#
# The supervisor keeps the binary, the plugin modules and the daemon
# environment it started with. `mise install` above moves `latest` under that
# live process, so restart the supervisor itself (not just a daemon) at the end
# of every apply: that also restarts every `boot_start` daemon, OpenCode
# included, and keeps the processes in sync with what was just deployed. Apply
# from a plain SSH shell — this kills any running OpenCode session.
#
# Grant the bind capability again before that restart. The capability lives on
# the binary's inode and `mise install` replaces the binary, so a freshly
# installed pitchfork cannot bind :443: the proxy dies with "Permission denied"
# and every ingress URL stops answering, while the DNS daemon keeps running and
# hides the cause. `pitchfork proxy setup` is the only thing that grants it. The
# getcap test keeps sudo off the common path, and `sudo -n` keeps a password
# prompt from hanging a non-interactive apply.
#
# systemd starts the user unit at boot only when lingering is enabled. Without
# it the unit waits for the first login, and the boot_start daemons stay down
# after a reboot. Enabling linger for your own account needs no authentication
# (polkit `set-self-linger` is allow_any/yes) and is idempotent, so no sudo.
[ "$(loginctl show-user "$USER" --property=Linger --value 2>/dev/null)" = "yes" ] ||
  loginctl enable-linger "$USER" >/dev/null 2>&1 || true

if command -v pitchfork >/dev/null 2>&1; then
  if ! getcap "$(readlink -f "$(command -v pitchfork)")" 2>/dev/null |
    grep -q cap_net_bind_service &&
    sudo -n true 2>/dev/null; then
    pitchfork proxy setup --yes >/dev/null 2>&1 || true
  fi
  pitchfork boot enable >/dev/null 2>&1 || true
  # `systemctl --user` resolves the user bus from XDG_RUNTIME_DIR, and the foot
  # host's ssh client leaks a foreign value (/tmp) into the instance: pin it the
  # way ~/bin/sklein-devbox-ingress does.
  if [ -d "/run/user/$(id -u)" ]; then
    export XDG_RUNTIME_DIR="/run/user/$(id -u)"
  fi
  if systemctl --user cat pitchfork >/dev/null 2>&1; then
    systemctl --user daemon-reload
    systemctl --user restart pitchfork ||
      echo "post-dotfiles: the pitchfork supervisor did not restart; the ingress proxy stays down until it does" >&2
  else
    pitchfork restart global/opencode-server >/dev/null 2>&1 || true
  fi
fi
'''

[tasks.update-catppuccin-tmux]
description = "Re-vendor the catppuccin/tmux plugin into the dotfiles"
run = "bash scripts/sync-catppuccin-tmux.sh"

[tasks.update-fzf-tab]
description = "Re-vendor the fzf-tab zsh plugin into the dotfiles"
run = "bash scripts/sync-fzf-tab.sh"

# Bootstrap secret inputs are resolved by fnox (backed by gopass), not by mise.
# `mise dot` and `mise bootstrap` must therefore run inside `fnox exec`, which
# exports the `[bootstrap.secrets]` values as environment variables. `raw_args`
# forwards the wrapped command's arguments verbatim (`apply`, `status`,
# `diff <target>`, `--force`, `--dry-run`, `--help`, ...).
[tasks.dot]
description = "Run `mise dot` with the bootstrap secrets injected by fnox"
raw_args = true
run = "fnox -c fnox.toml exec -- mise dot"

[tasks.bootstrap-all]
description = "Run the full mise bootstrap with fnox-provided secrets"
raw_args = true
run = "fnox -c fnox.toml exec -- mise bootstrap --yes"

[bootstrap.mise_shell_activate]
zprofile = "shims"
zshrc = "activate"
bash_profile = "shims"
bashrc = "activate"

[tools]
starship = "1.26.0"

# The home tree is deployed by one group that walks dotfiles/ and, thanks to
# dot_prefix, maps every `dot-<name>` path component to `.<name>`:
#   dotfiles/dot-config/...  -> ~/.config/...
#   dotfiles/dot-ssh/config  -> ~/.ssh/config
#   dotfiles/dot-zshrc       -> ~/.zshrc
#   dotfiles/dot-local/...   -> ~/.local/...
#   dotfiles/dot-kube/...    -> ~/.kube/...
#   dotfiles/bin/...         -> ~/bin/...
#
[dotfile_groups.home]
root = "."
target = "~"
mode = "copy"
dot_prefix = true
exclude = ["*.tera"]

[dotfile_groups.home.entries]
# Permissions the plain copy walk cannot express.
"~/.ssh/config"                     = { mode = "copy", permissions = "0600" }

# `~/bin` is on PATH (the base image's ~/.zprofile prepends it), so only
# commands meant to be typed by a human live there.
"~/bin/export-gpg-keys.sh"          = { mode = "copy", permissions = "0700" }
"~/bin/import-gpg-keys.sh"          = { mode = "copy", permissions = "0700" }
"~/bin/suspend_incus1.sh"           = { mode = "copy", permissions = "0700" }
"~/bin/wakeup_incus1.sh"            = { mode = "copy", permissions = "0700" }
"~/bin/lock-ssh-agent.sh"           = { mode = "copy", permissions = "0700" }
"~/bin/install-or-update-neovim.sh" = { mode = "copy", permissions = "0700" }
"~/bin/sklein-devbox-doctor"        = { mode = "copy", permissions = "0755" }
"~/bin/gpg-signing-doctor"          = { mode = "copy", permissions = "0755" }
"~/bin/sklein-devbox-mise-upgrade"  = { mode = "copy", permissions = "0755" }
"~/bin/sklein-devbox-ingress"       = { mode = "copy", permissions = "0755" }
"~/bin/import-opencode-credentials" = { mode = "copy", permissions = "0755" }
"~/bin/sklein-generate-opencode-context-report" = { mode = "copy", permissions = "0755" }

# Internal helpers, kept off PATH: gpg-agent runs pinentry-tmux, and the
# `opencode-port-free` pitchfork oneshot runs before opencode-server.
"~/.local/libexec/sklein-devbox/pinentry-tmux"      = { mode = "copy", permissions = "0755" }
"~/.local/libexec/sklein-devbox/opencode-port-free" = { mode = "copy", permissions = "0755" }

# Moved from ~/bin to ~/.local/libexec/sklein-devbox: `apply` never deletes a
# file, so remove the old copies explicitly; they were reachable from PATH.
"~/bin/pinentry-tmux"                = { mode = "absent" }
"~/bin/opencode-port-free"           = { mode = "absent" }

# Left behind by the OpenCode 1 -> 2 migration: tui.json became cli.json,
# auth.json* became credentials.json + `opencode auth import`, and the two
# switch scripts are replaced by `opencode auth switch` (or the TUI /
# OpenChamber account switcher). Remove these entries once no sklein-devbox
# instance still runs OpenCode 1.
"~/.config/opencode/tui.json"        = { mode = "absent" }
"~/bin/switch-opencode-auth-1.sh"    = { mode = "absent" }
"~/bin/switch-opencode-auth-2.sh"    = { mode = "absent" }
"~/.local/share/opencode/auth.json"  = { mode = "absent" }
"~/.local/share/opencode/auth.json1" = { mode = "absent" }
"~/.local/share/opencode/auth.json2" = { mode = "absent" }

# Templates (sources end in .tera, excluded from the walk above; the source is
# relative to the group root, i.e. dotfiles/).
"~/.config/pitchfork/config.toml"    = { source = "dot-config/pitchfork/config.toml.tera", mode = "template" }
"~/.config/gnupg/gpg-agent.conf"     = { source = "dot-config/gnupg/gpg-agent.conf.tera", mode = "template" }
"~/.config/incus/client.crt"         = { source = "dot-config/incus/client.crt.tera", mode = "template" }
"~/.config/incus/client.key"         = { source = "dot-config/incus/client.key.tera", mode = "template" }
"~/.config/gh/hosts.yml"             = { source = "dot-config/gh/hosts.yml.tera", mode = "template" }
"~/.config/opencode/opencode.jsonc"  = { source = "dot-config/opencode/opencode.jsonc.tera", mode = "template" }
"~/.local/share/opencode/credentials.json" = { source = "dot-local/share/opencode/credentials.json.tera", mode = "template", permissions = "0600" }
"~/.kube/config.d/homelab-stephane-klein-info.kubeconfig" = { source = "dot-kube/config.d/homelab-stephane-klein-info.kubeconfig.tera", mode = "template", permissions = "0600" }

# Entries whose source lives outside the group root, or that use inline content.
[dotfiles]
"~/.zshenv" = { content = "export PATH=\"$HOME/.local/bin:$PATH\"\n", permissions = "0644" }

# Default sound for the audio check of `~/bin/sklein-devbox-doctor` (CC0, see
# files/sounds/README.md). A dotfiles `copy` entry rather than a
# `[bootstrap.files]` one: mise reads `[bootstrap.files].source` as UTF-8 text,
# which rejects a binary file such as this Ogg Vorbis asset.
"~/.local/share/sklein-devbox/sounds/door-bell.ogg" = {
  source = "files/sounds/door-bell.ogg",
  mode = "copy",
  permissions = "0644"
}

[bootstrap.directories."~/.kube/"]
mode = "0700"

[bootstrap.directories."~/.kube/config.d/"]
mode = "0700"

[bootstrap.directories."~/.ssh/"]
mode = "0700"

[bootstrap.files."~/.ssh/id_rsa_2016"]
content = '''
{{ secret(name="SSH_ID_RSA_2016_PRIVATE")}}
'''
template = true
mode = "0600"

[bootstrap.files."~/.config/mise/github_tokens.toml"]
content = '''
[tokens."github.com"]
# GitHub token with read access to public repositories only. Useful to avoid
# GitHub rate limits when Mise installs tools. It grants no access to any of my private data.
token = "{{ secret(name="MISE_CI_READONLY_GITHUB_TOKEN") }}"
'''
template = true
mode = "0600"

[bootstrap.files."/usr/local/bin/ssh-tmux-login"]
source = "./files/ssh-tmux-login"
owner = "root"
group = "root"
mode = "0755"

# Remote-desktop link: the system xdg-open fails on the headless instance; this
# wrapper calls the foot host's desktop portal (org.freedesktop.portal.OpenURI)
# over the session bus reverse-forwarded to /tmp/foot-host-bus, so a remote
# `xdg-open` opens the URL in the local foot host's browser.
[bootstrap.files."/usr/local/bin/xdg-open"]
source = "./files/xdg-open"
owner = "root"
group = "root"
mode = "0755"

# Remote-desktop link: notify-send must reach the foot host's notification
# daemon over the session bus reverse-forwarded to /tmp/foot-host-bus. The bus
# is not exported globally (a foreign DBUS_SESSION_BUS_ADDRESS breaks podman's
# systemd sandbox cgroup), so this wrapper sets it for notify-send only.
[bootstrap.files."/usr/local/bin/notify-send"]
source = "./files/notify-send"
owner = "root"
group = "root"
mode = "0755"

[bootstrap.files."/etc/ssh/sshd_config.d/20-tmux-force.conf"]
source = "./files/sshd-tmux-force.conf"
owner = "root"
group = "root"
mode = "0644"
notify = ["sshd"]

[bootstrap.files."/etc/ssh/sshd_config.d/21-foot-link.conf"]
source = "./files/sshd-foot-link.conf"
owner = "root"
group = "root"
mode = "0644"
notify = ["sshd"]

[bootstrap.services.sshd]
state = "running"
enabled = true
on_change = "reload_or_restart"
