# Force every session of the "devbox" user through the shared launcher
# (/usr/local/bin/ssh-tmux-login) so tmux starts by default on interactive
# ssh login, whatever the user's shell is.
#
#   ssh -t host        -> tmux (default)
#   ssh -t host bash   -> plain interactive shell, no tmux (opt-out)
#   ssh host '<cmd>'   -> command/subsystem preserved (scp, rsync...)
#   ssh host (no tty)  -> login shell, no tmux
#
# ClientAlive*: when the workstation vanishes (suspend, network loss) the
# connection would otherwise linger until the TCP retransmissions give up -- the
# sshd keeps the dead session, and its tmux client keeps the console-* session
# attached, so ssh-tmux-login (which only reaps *unattached* console-* sessions)
# cannot clean it up. Probing the client every 30 s and giving up after 3 missed
# replies detaches it in ~90 s instead.
Match User devbox
    ForceCommand /usr/local/bin/ssh-tmux-login
    ClientAliveInterval 30
    ClientAliveCountMax 3
