[tools]
"go:github.com/lxc/distrobuilder/v3/distrobuilder" = { version = "v3.3.2-0.20260811001855-e2c0bcd03815" }
"github:lxc/incus" = { version = "v7.4.0", matching = "incus-simplestreams", bin = "incus-simplestreams" }
"github:rclone/rclone" = { version = "v1.75.0" }

[tasks.build-lxc]
description = "Build the sklein-devbox Fedora LXC container image with distrobuilder"
run = "scripts/build-lxc.sh"

[tasks.upload-images]
description = "Upload sklein-devbox-dev to the Scaleway S3 incus-images bucket"
quiet = true
run = "scripts/upload-images.sh"
