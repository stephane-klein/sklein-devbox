# Atuin configuration - format compact with working directory
# Documentation: https://docs.atuin.sh/configuration/config/

# Display style: compact
style = "compact"

# Column configuration: date, directory, command
[ui]
columns = ["time", "directory", "command"]

# Additional useful options
show_preview = true
enter_accept = false
filter_mode = "global"

# Interactive search UI (Ctrl-R): when running inside tmux, render it in a
# floating display-popup over the current pane instead of drawing over it.
[tmux]
enabled = true

# No cloud sync (local only)
[sync]
enabled = false

# Catppuccin theme. All 56 flavor/accent combinations are vendored in ./themes/
# (source: https://github.com/catppuccin/atuin). Switch flavor/accent via `name`.
[theme]
name = "catppuccin-macchiato-mauve"
