# Global mise configuration for the sklein-devbox container.
#
# Deployed to ~/.config/mise/config.toml by the bootstrap driver
# (see ../../../mise.toml and ../../../README.md).
#
# Loaded for every `mise` invocation, in every directory. It must not contain
# [bootstrap.*] or [dotfiles] entries; those live in the driver.

[shell_alias]
devbox-cd        = "cd \"$HOME/.local/share/sklein-devbox/sklein-devbox-mise-config\""
devbox-dot       = "mise -C \"$HOME/.local/share/sklein-devbox/sklein-devbox-mise-config\" run dot"
devbox-bootstrap = "mise -C \"$HOME/.local/share/sklein-devbox/sklein-devbox-mise-config\" run bootstrap-all"

# Point kubectl (and kubectx / kubens / k9s) at the per-cluster kubeconfigs
# deployed under ~/.kube/config.d/ by the driver's [dotfiles] entries. The
# state file comes first: kubectl reads and writes `current-context` in the
# first file of the list, so that file owns the active context.
[env]
KUBECONFIG = "{{ env.HOME }}/.kube/config.d/00-current.kubeconfig:{{ env.HOME }}/.kube/config.d/homelab-stephane-klein-info.kubeconfig"

# gpg keys are imported by ~/bin/import-gpg-keys.sh into ~/.config/gnupg (the
# XDG location used on the workstation); gpg defaults to ~/.gnupg instead, so
# expose GNUPGHOME to every mise-activated shell and task. Without it, jj/git
# signing fails with "No secret key".
GNUPGHOME = "{{ env.HOME }}/.config/gnupg"

# Install the Python CLI tools with pipx instead of uv. mise's uv
# dependency-graph locking names the install directory after a digest of the
# freshly resolved uv.lock; uv stamps that lock with a fresh `exclude-newer`
# timestamp on every resolution, so the digest never matches on the next run
# and mise reinstalls the tool into a new `~uv~<digest>` directory forever
# (`mise doctor` exits 1, the `pipx:*` tool shows as missing). pipx keeps the
# plain `<version>` install path, which is stable. `pipx` is required for this.
[settings.pypi]
uvx = false

[settings.shims]
# I exclude gopass from the shims to avoid an endless loop.
# It happened to me from time to time when entering projects managed by mise.
# It happens when a project declares a `_.source` without `tools = true`
# and the script calls gopass.
#
# mise evaluates `_.source` before loading the tools. The gopass shim is
# then on PATH. It calls mise again. mise evaluates `_.source` again,
# and the loop goes on.
#
# With this exclusion, gopass has no shim any more. A project that forgets
# `tools = true` prints "gopass: command not found".
# This is intentional: the message points at the fix to make.
#
# Correct example in `.mise.toml`:
#   [env]
#   _.source = { path = ".secret.sh", tools = true }
#
# The `.secret.sh` script contains for example:
#   export OPENAI_API_KEY=$(gopass show -o ...)
exclude = ["gopass"]

[tools]
age = "latest"
gopass = "latest"
fnox = { version = "1.46.0", workflow = "release.yml" }
tmux = "3.7c"
fzf = "0.74.5"
atuin = "18.24.4"
pitchfork = { version = "2.33.0", workflow = "release.yml@refs/heads/main" }

# Multi-command shell completion engine: dynamic completions for jj, gh,
# kubectl, k9s, helm, ... Loaded from dotfiles/dot-zshrc.
# Supported completers: https://carapace-sh.github.io/carapace-bin/completers.html
carapace = "1.8.2"

jujutsu = "0.46.0"
jjui = "0.10.12"

starship = "1.27.0"
"github:dmmulroy/jj-starship" = {
  version = "0.7.4",
  postinstall = "chmod u+x ${MISE_TOOL_INSTALL_PATH}/jj-starship"
}

# Tmux status bar / window scripts (see dotfiles/dot-config/tmux/scripts/):
# gum for the input prompts, petname for the default window name, and pipx
# which mise's pipx backend needs to install the Python tools.
"aqua:charmbracelet/gum" = "2.0.2"
pipx = "1.18.11"
"pipx:petname" = "2.9"

opencode = { version = "2.2.5", allow_builds = ["@opencode/cli"] }

# https://github.com/Shlomob/ocmonitor-share
"pipx:opencode-monitor" = "1.0.5"

ripgrep = "15.2.0"
fd = "10.5.0"
node = "26.13.0"
go = "latest"
neovim = "0.12.6"
tree-sitter = "0.27.1"
usage = { version = "7.1.5", workflow = "publish-cli.yml" }
delta = "0.20.1"
rtk = "1.1.0"
github-cli = "2.103.3"

claude-code = "2.1.316"

# Forgejo CLI (fj) + extension Actions (fj-ex)
"forgejo:forgejo-contrib/forgejo-cli" = "0.7.0"
"github:JKamsker/forgejo-cli-ex" = "0.1.12"

zoxide = "0.10.0"
jq = "1.8.2"
yq = "4.54.1"
yazi = "26.9.1"
lsd = "1.2.0"
"pipx:copier" = "9.19.1"
"github:tassiovirginio/try-rs" = "1.7.11"
"github:11happy/cpx" = "0.2.1"
"github:mitsuhiko/minijinja" = "3.0.5"
"github:laulauland/jj-hunk" = "0.5.1"
"github:newren/git-filter-repo" = "2.47.0"

# Incus client
"github:lxc/incus" = { version = "7.5", bin = "incus" }

# Tooling for OpenCode
"npm:@upstash/context7-mcp" = "4.4.4"
"pipx:mcp-server-fetch" = "2026.10.28"
"npm:tavily-mcp" = "0.2.22"
"npm:mcp-searxng" = "2.9.0"
"npm:exa-mcp-server" = "3.4.2"
"npm:cc-safety-net" = "2.7.1"
"npm:@playwright/mcp" = "0.0.84"
"npm:@openchamber/web" = "2.5.3"

# `ttok` (tiktoken) counts the tokens of the system blocks captured by
# ~/bin/sklein-generate-opencode-context-report. No tokenizer is published for
# the models themselves, so the report counts with o200k_base and rescales the
# block estimates onto the total the provider actually billed.
"pipx:ttok" = "1.0"

# Kubernetes
kubectl = "1.37.2"
helm = "4.3.1"
kubectx = "0.11.0"
kubens = "0.11.0"
helmfile = { version = "1.8.2", workflow = "releaser.yaml" }
k9s = "0.51.0"
qdns = "0.19.12"
