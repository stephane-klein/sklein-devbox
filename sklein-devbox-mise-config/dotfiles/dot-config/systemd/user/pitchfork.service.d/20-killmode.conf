# Fedora ships /usr/lib/systemd/user/service.d/10-timeout-abort.conf with
# TimeoutStopFailureMode=abort: a unit that fails to stop within TimeoutStopSec
# is SIGABRTed together with every process left in its cgroup. With the default
# KillMode=control-group, that killed conmon and rootlessport of the podman
# containers while the containers themselves survived in their libpod scopes,
# leaving them "Up" with a published port that no longer had a listener.
#
# KillMode=process sends the stop signal to the supervisor only. Pitchfork stays
# in charge of stopping its daemons, and a daemon that fails to stop no longer
# takes the network plumbing of every container with it.
#
# A drop-in rather than a line in the unit: `pitchfork boot enable`, re-run by
# the post-dotfiles hook on every apply, rewrites
# ~/.config/systemd/user/pitchfork.service and truncates the file.
[Service]
KillMode=process
