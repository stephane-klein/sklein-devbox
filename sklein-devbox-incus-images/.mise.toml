[tools]
"go:github.com/lxc/distrobuilder/v3/distrobuilder" = { version = "v3.3.2-0.20260811001855-e2c0bcd03815" }
"github:lxc/incus" = { version = "v7.4.0", matching = "incus-simplestreams", bin = "incus-simplestreams" }
"github:rclone/rclone" = { version = "v1.75.0" }

[tasks.build-lxc]
description = "Build the sklein-devbox Fedora LXC container image with distrobuilder"
run = """
DISTROBUILDER_BIN="$(mise which distrobuilder)"
sudo incus image delete sklein-devbox-dev >/dev/null 2>&1 || true
sudo systemd-run --scope --quiet \\
  -p CPUQuota=200% \\
  -p MemoryHigh=6G \\
  -p MemoryMax=10G \\
  -p IOWeight=1 \\
  -- "$DISTROBUILDER_BIN" build-incus fedora.yaml dist/sklein-devbox-dev \
  --sources-dir .distrobuilder-sources;

sudo chown -R $USER:$USER dist/sklein-devbox-dev
ls -lha dist/sklein-devbox-dev
"""

[tasks.upload-images]
description = "Upload sklein-devbox-dev to the Scaleway S3 incus-images bucket"
quiet = true
run = """
set -euo pipefail

for f in \\
  dist/sklein-devbox-dev/incus.tar.xz \\
  dist/sklein-devbox-dev/rootfs.squashfs; do
  test -f "$f" || { echo "ERROR: missing $f (run build-lxc)" >&2; exit 1; }
done

rm -rf .simplestreams && mkdir -p .simplestreams
(
  cd .simplestreams
  incus-simplestreams add --alias sklein-devbox-dev \
    ../dist/sklein-devbox-dev/incus.tar.xz \
    ../dist/sklein-devbox-dev/rootfs.squashfs
)

export RCLONE_S3_ACCESS_KEY_ID="$(gopass show -o homelab/incus-images/SCW_ACCESS_KEY)"
export RCLONE_S3_SECRET_ACCESS_KEY="$(gopass show -o homelab/incus-images/SCW_SECRET_KEY)"

rclone sync .simplestreams/ :s3:incus-images \
  --s3-provider Scaleway \
  --s3-endpoint https://s3.fr-par.scw.cloud \
  --s3-region fr-par \
  --s3-acl public-read \
  --log-level ERROR \
  --progress
"""
